<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Delivery Platform - Client Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans p-6" x-data="dashboard()">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- HEADER & ROLE NAVIGATION -->
    <header class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-xl font-bold text-amber-500 flex items-center gap-2">🍔 Food Delivery Operations</h1>
        <p class="text-xs text-slate-400">Microservices Production Portal (Gateway: http://localhost:5000)</p>
      </div>

      <!-- ROLE SELECTOR TABS -->
      <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-700 text-sm">
        <button @click="activeTab = 'customer'" :class="activeTab === 'customer' ? 'bg-amber-500 text-slate-900 font-bold' : 'text-slate-400 hover:text-white'" class="px-4 py-2 rounded-md transition">🛍️ Customer View</button>
        <button @click="activeTab = 'driver'" :class="activeTab === 'driver' ? 'bg-amber-500 text-slate-900 font-bold' : 'text-slate-400 hover:text-white'" class="px-4 py-2 rounded-md transition">🚗 Driver App</button>
        <button @click="activeTab = 'manager'" :class="activeTab === 'manager' ? 'bg-amber-500 text-slate-900 font-bold' : 'text-slate-400 hover:text-white'" class="px-4 py-2 rounded-md transition">📊 Manager Live Feed</button>
      </div>

      <!-- AUTH STATUS -->
      <div class="text-right">
        <span class="text-xs px-3 py-1.5 rounded-full font-semibold" :class="token ? 'bg-emerald-900 text-emerald-200 border border-emerald-700' : 'bg-rose-900 text-rose-200 border border-rose-700'" x-text="token ? 'Authenticated' : 'Logged Out'"></span>
      </div>
    </header>

    <!-- TAB 1: CUSTOMER PORTAL -->
    <main x-show="activeTab === 'customer'" class="grid md:grid-cols-2 gap-6">
      <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
        <h2 class="text-lg font-bold text-amber-400">1. Customer Login</h2>
        <div class="space-y-3">
          <input type="email" x-model="loginForm.email" placeholder="Email" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-amber-500">
          <input type="password" x-model="loginForm.password" placeholder="Password" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-amber-500">
          <button @click="login()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition">Sign In (Get JWT)</button>
        </div>
      </section>

      <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
        <h2 class="text-lg font-bold text-amber-400">2. Place Order</h2>
        <div class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-xs space-y-1">
          <div class="font-bold text-slate-200">Pepperoni Pizza x 2</div>
          <div class="text-slate-400">Total: <span class="text-emerald-400 font-bold">$37.00</span></div>
        </div>
        <button @click="submitOrder()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm transition">Checkout & Send to Gateway</button>
        <div x-text="orderStatus" class="text-xs font-semibold text-amber-300"></div>
      </section>
    </main>

    <!-- TAB 2: DRIVER APP -->
    <main x-show="activeTab === 'driver'" class="space-y-4">
      <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
        <div>
          <h2 class="text-lg font-bold text-amber-400">Driver Console</h2>
          <p class="text-xs text-slate-400">Manage order pickup and delivery lifecycle</p>
        </div>
        <button @click="fetchDeliveries()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold">Refresh Jobs</button>
      </div>

      <div class="grid md:grid-cols-2 gap-4">
        <template x-for="d in deliveries" :key="extractId(d)">
          <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-3">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xs text-slate-400">Order Ref:</span>
                <div class="font-mono text-sm font-bold text-amber-300" x-text="formatId(d.orderId || d.OrderId)"></div>
              </div>
              <span class="px-2.5 py-1 rounded-full text-xs font-bold" 
                    :class="getStatusColor(d.status || d.Status)" 
                    x-text="d.status || d.Status"></span>
            </div>

            <div class="text-xs text-slate-300">
              <strong>Assigned Driver:</strong> 
              <span x-text="d.driverName || d.DriverName" class="text-emerald-400 font-semibold"></span>
            </div>

            <!-- ACTION BUTTONS FOR DRIVER -->
            <div class="flex gap-2 pt-2">
              <button @click="updateStatus(d, 'InTransit')" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold py-2 rounded-lg transition">Pick Up Order</button>
              <button @click="updateStatus(d, 'Delivered')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 rounded-lg transition">Complete Delivery</button>
            </div>
          </div>
        </template>
      </div>
    </main>

    <!-- TAB 3: MANAGER OVERVIEW -->
    <main x-show="activeTab === 'manager'" class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-amber-400">Live System Monitor</h2>
        <button @click="fetchDeliveries()" class="text-xs text-amber-400 underline">Sync Deliveries</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-900 text-slate-400 uppercase">
            <tr>
              <th class="p-3">Delivery ID</th>
              <th class="p-3">Order ID</th>
              <th class="p-3">Driver</th>
              <th class="p-3">Status</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-700">
            <template x-for="d in deliveries" :key="extractId(d)">
              <tr class="hover:bg-slate-750">
                <td class="p-3 font-mono" x-text="formatId(extractId(d))"></td>
                <td class="p-3 font-mono text-amber-300" x-text="formatId(d.orderId || d.OrderId)"></td>
                <td class="p-3 text-emerald-400 font-semibold" x-text="d.driverName || d.DriverName"></td>
                <td class="p-3">
                  <span class="px-2 py-0.5 rounded text-xs font-bold" :class="getStatusColor(d.status || d.Status)" x-text="d.status || d.Status"></span>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </main>

  </div>

  <script>
    function dashboard() {
      return {
        activeTab: 'customer',
        token: '',
        loginForm: { email: 'shadi@example.com', password: 'Password123!' },
        orderStatus: '',
        deliveries: [],

        extractId(obj) {
          return obj.id || obj.Id || obj.deliveryId || obj.DeliveryId || '';
        },

        formatId(val) {
          const str = String(val || '');
          return str.length > 8 ? str.substring(0, 8) + '...' : str || 'N/A';
        },

        getStatusColor(status) {
          const s = String(status || '').toLowerCase();
          if (s.includes('delivered')) return 'bg-emerald-900 text-emerald-300 border border-emerald-700';
          if (s.includes('transit')) return 'bg-blue-900 text-blue-300 border border-blue-700';
          return 'bg-amber-900 text-amber-300 border border-amber-700';
        },

        async login() {
          try {
            const res = await fetch('http://localhost:5000/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.loginForm)
            });
            if (!res.ok) throw new Error('Login failed');
            const data = await res.json();
            this.token = data.token;
          } catch (e) { alert(e.message); }
        },

        async submitOrder() {
          if (!this.token) return alert('Please login first!');
          this.orderStatus = 'Submitting order...';
          try {
            const res = await fetch('http://localhost:5000/api/orders', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${this.token}`
              },
              body: JSON.stringify({
                customerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6",
                customerPhoneNumber: "+1234567890",
                deliveryAddress: "123 Main St",
                items: [{ productId: "a1b2c3d4-0000-0000-0000-111122223333", productName: "Pepperoni Pizza", unitPrice: 18.5, quantity: 2 }]
              })
            });
            if (res.status === 401) throw new Error('401 Unauthorized - Invalid JWT');
            if (!res.ok) throw new Error('Order creation failed');
            
            const data = await res.json();
    
            // Safely extract ID whether backend returns a raw GUID string or a JSON object
            const rawId = (typeof data === 'object' && data !== null) 
            ? (data.orderId || data.id || data.OrderId || data.value) 
            : data;

            this.orderStatus = `✅ Order Created! ID: ${this.formatId(rawId)}`;
            setTimeout(() => this.fetchDeliveries(), 1200);
            } catch (e) { this.orderStatus = `❌ Error: ${e.message}`; }
        },

        async fetchDeliveries() {
          try {
            const res = await fetch('http://localhost:5000/api/deliveries');
            if (res.ok) this.deliveries = await res.json();
          } catch (e) { console.error(e); }
        },

        async updateStatus(deliveryObj, newStatus) {
          const deliveryId = this.extractId(deliveryObj);
          if (!deliveryId) return alert('Error: Unable to determine Delivery ID');

          try {
            const res = await fetch(`http://localhost:5000/api/deliveries/${deliveryId}/status`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: newStatus })
            });
            
            if (!res.ok) {
              const errBody = await res.text();
              throw new Error(`HTTP ${res.status}: ${errBody}`);
            }
            
            await this.fetchDeliveries();
          } catch (e) { alert(`Failed to update status: ${e.message}`); }
        }
      }
    }
  </script>
</body>
</html>
